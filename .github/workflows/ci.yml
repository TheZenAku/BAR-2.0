name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Disposable CI-only database (Docker Compose service from compose.yaml); never a real environment.
      POSTGRES_PASSWORD: ci_only_password
      BAR_TEST_DATABASE_URL: postgres://bar:ci_only_password@127.0.0.1:5432/postgres
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Start PostgreSQL (compose.yaml)
        run: docker compose up -d --wait postgres
      - name: Migrations on a clean database (CLI)
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://bar:ci_only_password@127.0.0.1:5432/bar
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:arch
      - run: npm run check:licenses
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: e2e (chromium headless)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Disposable CI-only database (Docker Compose service from compose.yaml); never a real environment.
      POSTGRES_PASSWORD: ci_only_password
      BAR_TEST_DATABASE_URL: postgres://bar:ci_only_password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start PostgreSQL (compose.yaml)
        run: docker compose up -d --wait postgres
      - run: npx playwright install --with-deps chromium
      # Software WebGL (SwiftShader) on CI: validates behavior, not performance.
      - run: npm run test:e2e
        env:
          BAR_E2E_BROWSER: chromium
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-output
          path: tests/e2e/output/
          retention-days: 14
