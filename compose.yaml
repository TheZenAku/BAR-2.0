# Local/CI PostgreSQL. Usage: copy .env.example to .env, then `npm run db:up` (needs Docker).
# Without Docker: `npm run db:local` runs the same PostgreSQL major version from npm binaries (embedded-postgres).
name: bar
services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-bar}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432" # loopback only
    volumes:
      - pgdata:/var/lib/postgresql # PostgreSQL ≥ 18 images keep PGDATA under this directory
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
